<style>
/* ── Reset & Variables ────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0D0B2E;
  --surface: #14112E;
  --elevated: #1A1740;
  --purple: #7B6BA8;
  --lavender: #9B8EC8;
  --blue: #4A6CF7;
  --blue-bright: #5B7FFF;
  --green: #18DC7E;
  --amber: #F5A623;
  --red: #FF4757;
  --text: #FFFFFF;
  --text-secondary: #8B85AA;
  --text-dim: #6B6590;
  --border: #2D2855;
  --radius: 12px;
  --radius-lg: 16px;
  --gradient: linear-gradient(135deg, #7B6BA8, #4A6CF7);
  --card-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
  --sans: 'Space Grotesk', sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --sidebar-w: 240px;
}

html { scroll-behavior: smooth; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── Sidebar ──────────────────────────────────────── */
.sidebar {
  width: var(--sidebar-w);
  min-height: 100vh;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 24px 16px;
  position: fixed;
  top: 0; left: 0;
  z-index: 100;
  transition: width 0.3s ease;
}

.logo {
  font-family: var(--sans);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.5px;
  padding: 0 8px;
  margin-bottom: 40px;
  cursor: default;
  user-select: none;
}
.logo .l-g { color: #FFF; }
.logo .l-r { color: #7B6BA8; }
.logo .l-e1 { color: #9B8EC8; }
.logo .l-p1 { color: #FFF; }
.logo .l-p2 { color: #4A6CF7; }
.logo .l-l { color: #5B7FFF; }
.logo .l-e2 { color: #FFF; }

.nav { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px; border-radius: 10px;
  color: var(--text-secondary);
  font-size: 14px; font-weight: 500;
  cursor: pointer; transition: all 0.2s ease;
  text-decoration: none;
}
.nav-item:hover { background: rgba(123,107,168,0.1); color: var(--text); }
.nav-item.active {
  background: rgba(74,108,247,0.12);
  color: var(--blue-bright);
}
.nav-item.active .nav-icon { color: var(--blue-bright); }
.nav-icon { width: 20px; height: 20px; flex-shrink: 0; opacity: 0.7; }
.nav-item.active .nav-icon { opacity: 1; }

.sidebar-bottom { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); }
.wallet-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 10px 16px;
  background: var(--gradient);
  border: none; border-radius: 10px;
  color: #FFF; font-family: var(--sans);
  font-size: 13px; font-weight: 600;
  cursor: pointer; transition: opacity 0.2s, transform 0.15s;
}
.wallet-btn:hover { opacity: 0.9; transform: translateY(-1px); }

/* ── Main Content ─────────────────────────────────── */
.main {
  flex: 1;
  margin-left: var(--sidebar-w);
  padding: 28px 32px;
  min-height: 100vh;
}

/* Top bar */
.top-bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 16px;
  margin-bottom: 28px;
}
.page-title {
  font-size: 24px; font-weight: 700;
  background: var(--gradient);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-right: auto;
}
.search-box {
  position: relative; width: 260px;
}
.search-box input {
  width: 100%; padding: 9px 14px 9px 38px;
  background: var(--elevated);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: var(--sans);
  font-size: 13px;
  outline: none; transition: border-color 0.2s;
}
.search-box input::placeholder { color: var(--text-dim); }
.search-box input:focus { border-color: var(--purple); }
.search-box svg {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px; color: var(--text-dim);
}

.view-toggle {
  display: flex; gap: 2px;
  background: var(--elevated);
  border-radius: 8px; padding: 3px;
  border: 1px solid var(--border);
}
.view-btn {
  padding: 6px 10px; border-radius: 6px;
  background: none; border: none;
  color: var(--text-dim); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.view-btn.active { background: var(--purple); color: #FFF; }
.view-btn:hover:not(.active) { color: var(--text-secondary); }
.view-btn svg { width: 16px; height: 16px; }

/* Filter pills */
.filters {
  display: flex; gap: 8px; flex-wrap: wrap;
  margin-bottom: 24px;
}
.pill {
  padding: 6px 16px; border-radius: 20px;
  background: var(--elevated);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all 0.2s;
  font-family: var(--sans);
}
.pill:hover { border-color: var(--purple); color: var(--text); }
.pill.active {
  background: rgba(74,108,247,0.15);
  border-color: var(--blue);
  color: var(--blue-bright);
}

/* ── Masonry Layout ───────────────────────────────── */
.masonry {
  columns: 3;
  column-gap: 20px;
}
.masonry .card {
  break-inside: avoid;
  margin-bottom: 20px;
  display: inline-block;
  width: 100%;
}

/* ── Card Styles ──────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  box-shadow: var(--card-shadow);
  transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.3s ease;
  position: relative;
  overflow: hidden;
}
.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 32px rgba(74,108,247,0.15), 0 2px 8px rgba(0,0,0,0.3);
  border-color: rgba(123,107,168,0.5);
}
.card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: var(--gradient);
  opacity: 0; transition: opacity 0.3s;
}
.card:hover::before { opacity: 1; }

/* Featured banner */
.card-featured-banner {
  position: absolute; top: 14px; right: -32px;
  background: linear-gradient(135deg, #F5A623, #FF6B35);
  color: #FFF; font-size: 10px; font-weight: 700;
  padding: 3px 40px; transform: rotate(45deg);
  letter-spacing: 0.5px; text-transform: uppercase;
}

/* Card header */
.card-header {
  display: flex; align-items: flex-start; gap: 12px;
  margin-bottom: 14px;
}
.card-rank {
  width: 28px; height: 28px;
  background: var(--gradient);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700;
  flex-shrink: 0; color: #FFF;
}
.card-rank.top3 { background: linear-gradient(135deg, #F5A623, #FF6B35); }
.card-info { flex: 1; min-width: 0; }
.card-name {
  font-size: 15px; font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card-tag {
  display: inline-block;
  padding: 2px 8px; border-radius: 6px;
  font-size: 11px; font-weight: 500;
  background: rgba(74,108,247,0.12);
  color: var(--blue-bright);
}
.card-tag.defi { background: rgba(24,220,126,0.12); color: var(--green); }
.card-tag.devtools { background: rgba(155,142,200,0.12); color: var(--lavender); }
.card-tag.database { background: rgba(245,166,35,0.12); color: var(--amber); }
.card-tag.ai { background: rgba(91,127,255,0.12); color: var(--blue-bright); }
.card-tag.search { background: rgba(123,107,168,0.12); color: var(--purple); }

/* Description */
.card-desc {
  font-size: 13px; color: var(--text-secondary);
  line-height: 1.5; margin-bottom: 16px;
}

/* Score ring */
.score-ring-wrap {
  display: flex; align-items: center; justify-content: center;
  margin: 16px 0;
}
.score-ring { position: relative; }
.score-ring svg { transform: rotate(-90deg); }
.score-ring-label {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}
.score-ring-value {
  font-size: 20px; font-weight: 700;
  font-family: var(--mono);
  color: var(--text);
  line-height: 1;
}
.score-ring-value.lg { font-size: 26px; }
.score-ring-sub {
  font-size: 10px; color: var(--text-dim);
  margin-top: 2px;
}

/* Inline score (compact card) */
.score-inline {
  display: flex; align-items: center; gap: 8px;
  margin: 10px 0;
}
.score-number {
  font-family: var(--mono);
  font-size: 28px; font-weight: 700;
}
.score-number.excellent { color: var(--green); }
.score-number.good { color: var(--blue-bright); }
.score-number.mid { color: var(--amber); }

/* Metric bars */
.metrics { display: flex; flex-direction: column; gap: 8px; margin: 14px 0; }
.metric {
  display: flex; align-items: center; gap: 8px;
}
.metric-label {
  font-size: 11px; color: var(--text-dim);
  width: 72px; flex-shrink: 0;
  font-family: var(--mono);
}
.metric-bar-bg {
  flex: 1; height: 6px;
  background: rgba(45,40,85,0.8);
  border-radius: 3px; overflow: hidden;
}
.metric-bar {
  height: 100%; border-radius: 3px;
  transition: width 0.8s ease;
}
.metric-bar.green { background: linear-gradient(90deg, #18DC7E, #20E88A); }
.metric-bar.blue { background: linear-gradient(90deg, #4A6CF7, #5B7FFF); }
.metric-bar.purple { background: linear-gradient(90deg, #7B6BA8, #9B8EC8); }
.metric-bar.amber { background: linear-gradient(90deg, #F5A623, #FFBF47); }
.metric-val {
  font-size: 11px; font-family: var(--mono);
  color: var(--text-secondary); width: 30px; text-align: right;
}

/* Sparkline */
.sparkline-wrap {
  margin: 12px 0 4px;
  display: flex; align-items: center; gap: 8px;
}
.sparkline-label { font-size: 11px; color: var(--text-dim); }
.sparkline-change {
  font-size: 11px; font-family: var(--mono); font-weight: 600;
}
.sparkline-change.up { color: var(--green); }
.sparkline-change.down { color: var(--red); }

/* Card footer */
.card-footer {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 14px; padding-top: 12px;
  border-top: 1px solid var(--border);
}
.card-calls {
  font-size: 12px; color: var(--text-dim);
  font-family: var(--mono);
}
.card-link {
  font-size: 12px; font-weight: 600;
  color: var(--blue-bright);
  text-decoration: none;
  transition: color 0.2s;
  cursor: pointer;
}
.card-link:hover { color: #FFF; }

/* ── Responsive ───────────────────────────────────── */
@media (max-width: 1200px) {
  .masonry { columns: 2; }
}
@media (max-width: 768px) {
  .sidebar { display: none; }
  .main { margin-left: 0; padding: 20px 16px; }
  .masonry { columns: 1; }
  .search-box { width: 100%; }
  .top-bar { gap: 12px; }
}

/* ── Animations ───────────────────────────────────── */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.card { animation: fadeInUp 0.5s ease both; }
.card:nth-child(1) { animation-delay: 0.03s; }
.card:nth-child(2) { animation-delay: 0.06s; }
.card:nth-child(3) { animation-delay: 0.09s; }
.card:nth-child(4) { animation-delay: 0.12s; }
.card:nth-child(5) { animation-delay: 0.15s; }
.card:nth-child(6) { animation-delay: 0.18s; }
.card:nth-child(7) { animation-delay: 0.21s; }
.card:nth-child(8) { animation-delay: 0.24s; }
.card:nth-child(9) { animation-delay: 0.27s; }
.card:nth-child(10) { animation-delay: 0.30s; }
.card:nth-child(11) { animation-delay: 0.33s; }
.card:nth-child(12) { animation-delay: 0.36s; }
.card:nth-child(13) { animation-delay: 0.39s; }
.card:nth-child(14) { animation-delay: 0.42s; }
.card:nth-child(15) { animation-delay: 0.45s; }

/* Glow on hover */
.card:hover {
  background: linear-gradient(var(--surface), var(--surface)) padding-box,
              linear-gradient(135deg, rgba(123,107,168,0.4), rgba(74,108,247,0.4)) border-box;
  border-color: transparent;
}
</style>

// ── Helpers ────────────────────────────────────────
function scoreColor(s) {
  if (s >= 90) return '#18DC7E';
  if (s >= 80) return '#5B7FFF';
  if (s >= 70) return '#F5A623';
  return '#FF4757';
}

function scoreClass(s) {
  if (s >= 90) return 'excellent';
  if (s >= 80) return 'good';
  return 'mid';
}

function barColor(val) {
  if (val >= 90) return 'green';
  if (val >= 80) return 'blue';
  if (val >= 70) return 'purple';
  return 'amber';
}

function makeRing(score, size, strokeW, isLg) {
  const r = (size - strokeW) / 2;
  const circ = 2 * Math.PI * r;
  const offset = circ * (1 - score / 100);
  const color = scoreColor(score);
  return `<div class="score-ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(45,40,85,0.8)" stroke-width="${strokeW}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${strokeW}"
        stroke-dasharray="${circ}" stroke-dashoffset="${offset}" stroke-linecap="round"
        style="transition:stroke-dashoffset 1s ease"/>
    </svg>
    <div class="score-ring-label">
      <div class="score-ring-value ${isLg?'lg':''}" style="color:${color}">${score}</div>
      <div class="score-ring-sub">Score</div>
    </div>
  </div>`;
}

function makeSparkline(data, w, h, color) {
  const max = Math.max(...data), min = Math.min(...data);
  const range = max - min || 1;
  const step = w / (data.length - 1);
  let path = '';
  data.forEach((v, i) => {
    const x = i * step;
    const y = h - ((v - min) / range) * (h - 4) - 2;
    path += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1);
  });
  // gradient fill
  const lastX = (data.length - 1) * step;
  const fillPath = path + `L${lastX},${h}L0,${h}Z`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <defs><linearGradient id="sg${color.replace('#','')}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${fillPath}" fill="url(#sg${color.replace('#','')})" />
    <path d="${path}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round"/>
  </svg>`;
}

// ── Render Cards ──────────────────────────────────
function renderCards() {
  const container = document.getElementById('masonry');
  container.innerHTML = '';

  tools.forEach(t => {
    let html = '';

    // Featured banner
    if (t.featured) {
      html += `<div class="card-featured-banner">Featured</div>`;
    }

    // Header: rank + name + tag
    html += `<div class="card-header">
      <div class="card-rank ${t.rank <= 3 ? 'top3' : ''}">#${t.rank}</div>
      <div class="card-info">
        <div class="card-name">${t.name}</div>
        <span class="card-tag ${t.tagClass}">${t.tag}</span>
      </div>
    </div>`;

    // Description (featured only)
    if (t.featured && t.desc) {
      html += `<div class="card-desc">${t.desc}</div>`;
    }

    if (t.compact) {
      // ── Compact card: inline score + mini sparkline ──
      const color = scoreColor(t.score);
      html += `<div class="score-inline">
        <span class="score-number ${scoreClass(t.score)}">${t.score}</span>
        <span style="font-size:12px;color:var(--text-dim)">/ 100</span>
      </div>`;
      html += `<div class="sparkline-wrap">
        ${makeSparkline(t.sparkline, 100, 28, color)}
        <span class="sparkline-change up">${t.change}%</span>
      </div>`;
    } else {
      // ── Full card: ring + metrics + sparkline ──
      const ringSize = t.featured ? 110 : 90;
      const ringStroke = t.featured ? 8 : 6;
      html += `<div class="score-ring-wrap">
        ${makeRing(t.score, ringSize, ringStroke, t.featured)}
      </div>`;

      // Metric bars
      if (t.reliability !== undefined) {
        html += `<div class="metrics">`;
        const metrics = [
          ['Reliab.', t.reliability],
          ['Latency', t.latency],
          ['Coverage', t.coverage],
          ['Security', t.security]
        ];
        metrics.forEach(([label, val]) => {
          html += `<div class="metric">
            <span class="metric-label">${label}</span>
            <div class="metric-bar-bg"><div class="metric-bar ${barColor(val)}" style="width:${val}%"></div></div>
            <span class="metric-val">${val}</span>
          </div>`;
        });
        html += `</div>`;
      }

      // Sparkline
      const color = scoreColor(t.score);
      html += `<div class="sparkline-wrap">
        <span class="sparkline-label">30d trend</span>
        ${makeSparkline(t.sparkline, 80, 24, color)}
        <span class="sparkline-change up">${t.change}%</span>
      </div>`;
    }

    // Footer
    html += `<div class="card-footer">
      <span class="card-calls">${t.calls} calls</span>
      <a class="card-link" href="#">View Details &rarr;</a>
    </div>`;

    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = html;
    container.appendChild(div);
  });
}

renderCards();

// ── Filter pill interaction ──
document.querySelectorAll('.pill').forEach(pill => {
  pill.addEventListener('click', () => {
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
  });
});

// ── View toggle interaction ──
document.querySelectorAll('.view-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});
</script>
